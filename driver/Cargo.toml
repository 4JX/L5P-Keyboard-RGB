[package]
name = "legion-rgb-driver"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0.12"

[target.'cfg(target_os = "windows")'.dependencies]
# The native backend is pure Rust, so Windows builds don't need a C toolchain
# just for hidapi.
hidapi = { version = "2.6.3", default-features = false, features = [
    "windows-native",
] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.3", default-features = false, features = [
    "linux-static-libusb",
] }
