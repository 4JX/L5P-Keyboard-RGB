[package]
name = "legion-input"
version = "0.1.0"
edition = "2021"
authors = ["4JX"]
license = "GPL-3.0"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
nix = { version = "0.29", features = ["poll"] }

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]
